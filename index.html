
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persian Virtual Keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="keyboard-container">

        <h1>Persian Keyboard</h1>
        <p class="subtitle">Virtual Typing Experience</p>

        <textarea id="display" placeholder="اینجا تایپ کنید..." ></textarea>

        <div class="keyboard">

            <div class="row numbers">
                <button>۱</button>
                <button>۲</button>
                <button>۳</button>
                <button>۴</button>
                <button>۵</button>
                <button>۶</button>
                <button>۷</button>
                <button>۸</button>
                <button>۹</button>
                <button>۰</button>
                <button class="delete">پاک کردن</button>
            </div>

            <div class="row">
                <button>ض</button>
                <button>ص</button>
                <button>ث</button>
                <button>ق</button>
                <button>ف</button>
                <button>غ</button>
                <button>ع</button>
                <button>ه</button>
                <button>خ</button>
                <button>ح</button>
                <button>ج</button>
                <button>چ</button>
            </div>

            <div class="row">
                <button>ش</button>
                <button>س</button>
                <button>ی</button>
                <button>ب</button>
                <button>ل</button>
                <button>ا</button>
                <button>ت</button>
                <button>ن</button>
                <button>م</button>
                <button>ک</button>
                <button>گ</button>
                <button>و</button>
            </div>

            <div class="row">
                <button>ظ</button>
                <button>ط</button>
                <button>ز</button>
                <button>ر</button>
                <button>ذ</button>
                <button>د</button>
                <button>پ</button>
                <button>ژ</button>
                <button>.</button>
                <button>،</button>
                <button class="space">فاصله</button>
            </div>

            <div class="actions">
                <button class="clear">پاک کردن همه</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
